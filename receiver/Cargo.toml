[package]
name = "receiver"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
qrcode = { version = "0.14", default-features = false }
uuid = { version = "1", features = ["v4", "fast-rng"] }
local-ip-address = "0.6"
hostname = "0.4"
vigem-client = "0.1.4"
